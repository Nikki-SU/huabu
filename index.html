<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>田野材料大纲画布</title>
<style>
  @font-face{ font-family:'LXGW WenKai'; src:url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/fonts/LXGWWenKai-Regular.woff2') format('woff2'); font-display:swap; }
  :root{
    --logic:#4F46E5; --event:#059669; --theory:#EA580C;
    --edge:#5a6472; --grid:#e8e8ec; --border:#d8d8e0; --hl:#e11d48;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#fafafa;color:#1b1b1f;
    font-family:"LXGW WenKai","Kaiti SC","STKaiti","KaiTi","楷体",serif;}
  #toolbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:30;display:flex;align-items:center;gap:2px;padding:0 8px;background:#fff;border-bottom:1px solid var(--border);-webkit-user-select:none;user-select:none;overflow-x:auto;overflow-y:hidden;}
  #toolbar .brand{font-weight:700;font-size:15px;margin:0 8px 0 2px;white-space:nowrap;flex:none;}
  .sep{width:1px;height:24px;background:var(--border);flex:none;margin:0 4px;}
  .btn{height:34px;width:34px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#333;}
  .btn:hover{background:#f0f0f4;}
  .btn.active{background:#111;color:#fff;border-color:#111;}
  .btn.on{background:#1b1b1f;color:#fff;border-color:#1b1b1f;}
  .btn svg{width:19px;height:19px;}
  .btn[data-group="file"]:not(.active):not(.on){color:#3B82F6;}
  .btn[data-group="edit"]:not(.active):not(.on){color:#8B5CF6;}
  .btn[data-group="view"]:not(.active):not(.on){color:#14B8A6;}
  .btn[data-group="io"]:not(.active):not(.on){color:#F59E0B;}
  .btn[data-group="zoom"]:not(.active):not(.on){color:#64748B;}
  .num{width:40px;height:30px;border:1px solid var(--border);border-radius:6px;text-align:center;font-size:12px;flex:none;}
  .dim{display:inline-flex;align-items:center;justify-content:center;flex:none;margin:0 2px;}
  #tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 auto;min-width:0;padding:0 4px;}
  .tab{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;max-width:170px;flex:none;white-space:nowrap;}
  .tab .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .tab .tname[contenteditable="true"]{outline:1px dashed #4F46E5;background:#fff;color:#111;cursor:text;min-width:44px;padding:0 2px;}
  .tab .tclose{color:#999;font-weight:700;}
  .tab .tclose:hover{color:#111;}
  .tab .tdot{color:#F59E0B;font-size:9px;flex:none;line-height:1;}
  .tab.active{background:#111;color:#fff;border-color:#111;}
  .tab.active .tdot{color:#fbbf24;}
  #sidebar{position:fixed;top:52px;left:0;bottom:0;width:264px;z-index:28;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(0);transition:transform .15s;}
  #sidebar.hidden{transform:translateX(-100%);}
  #lib-head{padding:8px;border-bottom:1px solid var(--border);}
  #lib-search{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;outline:none;font-family:inherit;}
  #lib-body{flex:1;overflow-y:auto;padding:6px;}
  #lib-tabs{display:flex;gap:5px;padding:8px 8px 0;}
  .lib-tab{flex:1;height:32px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#333;}
  .lib-tab[data-tab="logic"].sel{background:var(--logic);color:#fff;border-color:var(--logic);}
  .lib-tab[data-tab="event"].sel{background:var(--event);color:#fff;border-color:var(--event);}
  .lib-tab[data-tab="theory"].sel{background:var(--theory);color:#fff;border-color:var(--theory);}
  .lib-card{border-radius:8px;padding:8px 10px;cursor:grab;font-size:13px;color:#fff;margin-bottom:5px;}
  .lib-card .t{font-weight:700;color:#fff;}
  .lib-card .c{color:rgba(255,255,255,.85);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lib-card:hover{filter:brightness(1.08);}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(20,20,24,.86);color:#fff;font-size:12px;padding:7px 16px;border-radius:999px;pointer-events:none;white-space:nowrap;}
  #loading{position:fixed;inset:0;z-index:100;background:rgba(255,255,255,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  #loading .spinner{width:34px;height:34px;border:3px solid #d8d8e0;border-top-color:#4F46E5;border-radius:50%;animation:hspin .7s linear infinite;}
  #loading .load-txt{font-size:13px;color:#555;}
  @keyframes hspin{to{transform:rotate(360deg);}}
  #viewport{position:absolute;top:52px;left:264px;right:0;bottom:0;overflow:hidden;cursor:default;touch-action:none;}
  #viewport.full{left:0;}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;}
  #grid{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  body.connect-mode #viewport{cursor:crosshair;}
  body.connect-mode .node{cursor:crosshair !important;}
  body.connect-mode .node .port,body.connect-mode .node .resize{display:none !important;}
  body.connect-mode .node:hover{box-shadow:0 0 0 2px #4F46E5;}
  body.connect-mode .node.link-src,body.connect-mode .node.link-src:hover{box-shadow:0 0 0 2.5px #e11d48;}
  #edges{position:absolute;top:0;left:0;overflow:visible;z-index:1;}
  #nodes{position:absolute;top:0;left:0;z-index:2;}
  #guides{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:3;}
  .node{position:absolute;min-width:120px;border-radius:8px;background:var(--theory);border:2px solid var(--theory);box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:visible;}
  .node[data-type="logic"]{background:var(--logic);border-color:var(--logic);}
  .node[data-type="event"]{background:var(--event);border-color:var(--event);}
  .node[data-type="theory"]{background:var(--theory);border-color:var(--theory);}
  .node.selected{outline:2px solid #111;outline-offset:2px;}
  .node .titlebar{display:flex;align-items:center;gap:4px;padding:5px 7px;background:rgba(0,0,0,.12);cursor:default;}
  .node .grip{cursor:grab;flex:none;width:10px;font-size:12px;color:#fff;opacity:.75;}
  .node .grip:active{cursor:grabbing;}
  .node .fold{flex:none;width:14px;cursor:pointer;color:#fff;font-size:11px;text-align:center;}
  .node .ntitle{flex:1;color:#fff;font-weight:600;font-size:14px;line-height:1.3;outline:none;white-space:pre-wrap;word-break:break-word;min-width:0;}
  .node .ntitle:empty::before{content:'标题';color:rgba(255,255,255,.65);}
  .node .nbody{padding:8px 11px;color:#fff;font-size:14px;line-height:1.55;outline:none;min-height:34px;white-space:pre-wrap;word-break:break-word;}
  .node .nbody:empty::before{content:'内容';color:rgba(255,255,255,.65);}
  .node.collapsed .nbody{display:none;}
  .node .resize{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;background:#fff;border:1px solid rgba(0,0,0,.3);border-radius:0 0 7px 0;cursor:nwse-resize;display:none;}
  .node:hover .resize{display:block;}
  .node.dragging{box-shadow:0 8px 24px rgba(0,0,0,.28);}
  .port{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #667;transform:translate(-50%,-50%);cursor:crosshair;z-index:3;display:none;}
  .node:hover .port{display:block;}
  .port:hover{background:#ffd24d;border-color:#111;}
  .port.p-top{left:50%;top:0;} .port.p-right{left:100%;top:50%;} .port.p-bottom{left:50%;top:100%;} .port.p-left{left:0;top:50%;}
  .edge-path{cursor:pointer;fill:none;stroke:var(--edge);stroke-width:1.8;stroke-linecap:round;}
  .edge-path.hi{stroke:var(--hl);stroke-width:2.6;}
  .edge-main{fill:none;stroke:var(--edge);stroke-width:3.5;stroke-linecap:round;}
  .edge-main.hi{stroke:var(--hl);}
  .edge-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;}
  .edge-label{font-size:13px;fill:#333;cursor:text;text-anchor:middle;font-weight:700;stroke:#fff;stroke-width:3;stroke-linejoin:round;paint-order:stroke;}
  .edge-port{cursor:crosshair;}
  #edge-tools{position:fixed;display:none;z-index:30;background:#fff;border:1px solid #d8dee9;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:3px;gap:4px;}
  #edge-tools button{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;background:#f2f4f8;border-radius:5px;cursor:pointer;color:#444;padding:0;}
  #edge-tools button svg{width:15px;height:15px;display:block;}
  #edge-tools button:hover{background:#e4e8f0;color:#111;}
  #edge-tools button#edge-del-btn:hover{background:#fee2e2;color:#b91c1c;}
  /* 固定浮动画板（图例式添加） */
  #add-legend{position:fixed;left:272px;top:60px;z-index:29;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:6px;}
  .add-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:grab;font-size:14px;color:#fff;min-width:74px;-webkit-user-select:none;user-select:none;}
  .add-item:active{cursor:grabbing;}
  .add-item[data-add="logic"]{background:var(--logic);}
  .add-item[data-add="event"]{background:var(--event);}
  .add-item[data-add="theory"]{background:var(--theory);}
  .float-input{position:fixed;z-index:60;min-width:180px;background:#fff;border:1px solid #444;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.25);padding:6px;display:none;}
  .float-input textarea{width:100%;min-height:44px;border:none;outline:none;resize:vertical;font-size:13px;font-family:inherit;}
  .float-input .row{display:flex;justify-content:flex-end;gap:6px;margin-top:4px;}
  .float-input button{height:26px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:12px;font-family:inherit;}
  #ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;display:none;min-width:80px;min-height:44px;border-radius:8px;color:#fff;padding:8px 14px;font-size:14px;opacity:.85;}
  #promptbox{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;max-height:72vh;background:#fff;border:1px solid #444;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.3);padding:16px;display:none;flex-direction:column;}
  #promptbox textarea{width:100%;height:200px;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;font-family:monospace;resize:vertical;}
  #promptbox .prow{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
  #promptbox .prow .btn{width:auto;height:30px;padding:0 12px;font-family:inherit;}
</style>
</head>
<body>

<div id="toolbar">
  <span class="brand"><svg width="36" height="36" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" fill="#fff" stroke="#d8d8e0" stroke-width="1"/><rect x="4" y="4" width="4.6" height="16" rx="2.2" fill="#4F46E5"/><rect x="9.7" y="4" width="4.6" height="16" rx="2.2" fill="#059669"/><rect x="15.4" y="4" width="4.6" height="16" rx="2.2" fill="#EA580C"/></svg></span>
  <button class="btn" id="new-doc" data-group="file" title="新建">ICON(plus)</button>
  <button class="btn" id="open-doc" data-group="file" title="打开">ICON(folder)</button>
  <button class="btn" id="save-doc" data-group="file" title="保存">ICON(save)</button>
  <button class="btn" id="saveas-doc" data-group="file" title="另存为文件(File System Access)">ICON(saveas)</button>
  <button class="btn" id="export-json" data-group="file" title="导出数据(.json · 浏览器下载)">ICON(filedown)</button>
  <button class="btn" id="clear-doc" data-group="file" title="清空">ICON(trash)</button>
  <button class="btn" id="undo" data-group="edit" title="撤销">ICON(undo)</button>
  <button class="btn" id="redo" data-group="edit" title="恢复撤销">ICON(redo)</button>
  <span class="sep"></span>
  <button class="btn" id="lib" data-group="view" title="组件库">ICON(sidebar)</button>
  <button class="btn" id="only-logic" data-group="view" title="只看逻辑链">ICON(filter)</button>
  <button class="btn" id="undirected" data-group="view" title="无向/有向线开关">ICON(biline)</button>
  <button class="btn" id="connect-mode" data-group="view" title="连线模式：开启后依次点两个框即自动连线（有向/无向跟随左侧开关，自动选最美观的出线侧），Esc 取消">ICON(connect)</button>
  <button class="btn" id="export-chain-md" data-group="view" title="导逻辑链(单击md/双击json)">ICON(upload)</button>
  <button class="btn" id="tidy-layout" data-group="view" title="整理布局（同级同行对齐·同级等宽·父节点居中·等距）">ICON(layout)</button>
  <button class="btn on" id="snap-toggle" data-group="view" title="智能吸附（拖动时显示对齐提示；关闭则自由摆放）">ICON(magnet)</button>
  <button class="btn on" id="grid-snap" data-group="view" title="网格吸附（节点对齐到网格线）">ICON(gridsnap)</button>
  <span class="sep"></span>
  <button class="btn" id="import-md" data-group="io" title="导入组件md">ICON(download)</button>
  <button class="btn" id="copy-prompt" data-group="io" title="复制md规则">ICON(copy)</button>
  <button class="btn" id="export-jpg" data-group="io" title="导出JPG">ICON(image)</button>
  <span class="sep"></span>
  <button class="btn" id="zoom-out" data-group="zoom" title="缩小">−</button>
  <button class="btn" id="zoom-reset" data-group="zoom" title="复位">1:1</button>
  <button class="btn" id="zoom-in" data-group="zoom" title="放大">＋</button>
  <span class="sep"></span>
  <span class="dim" title="宽度（水平方向）"><svg width="20" height="10" viewBox="0 0 20 10" fill="none" stroke="#777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="5" x2="19" y2="5"/><polyline points="5 2 1 5 5 8"/><polyline points="15 2 19 5 15 8"/></svg></span><input class="num" id="def-w" value="160">
  <span class="dim" title="高度（垂直方向）"><svg width="8" height="20" viewBox="0 0 8 20" fill="none" stroke="#777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="1" x2="4" y2="19"/><polyline points="1 5 4 1 7 5"/><polyline points="1 15 4 19 7 15"/></svg></span><input class="num" id="def-h" value="90">
  <span class="sep"></span>
  <div id="tabs"></div>
  <input type="file" id="import-file" accept=".json,.md" style="display:none">
  <input type="file" id="import-md-file" accept=".md,.txt" style="display:none">
</div>

<div id="sidebar">
  <div id="lib-head"><input id="lib-search" placeholder="搜索标题/内容…"></div>
  <div id="lib-tabs">
    <div class="lib-tab" data-tab="logic">逻辑</div>
    <div class="lib-tab" data-tab="event">事件</div>
    <div class="lib-tab" data-tab="theory">理论</div>
  </div>
  <div id="lib-body"></div>
</div>

<div id="viewport"><svg id="grid"></svg><div id="world"><svg id="edges"></svg><div id="nodes"></div><svg id="guides"></svg></div></div>

<div id="add-legend">
  <div class="add-item" data-add="logic">逻辑</div>
  <div class="add-item" data-add="event">事件</div>
  <div class="add-item" data-add="theory">理论</div>
</div>

<div id="hint"></div>
<div id="loading"><div class="spinner"></div><div class="load-txt">正在加载工作区…</div></div>
<div class="float-input" id="float-input"><textarea id="float-text"></textarea><div class="row"><button id="float-cancel">取消</button><button id="float-ok">确定</button></div></div>
<div id="edge-tools"><button id="edge-label-btn" title="编辑连线文字（Enter）"></button><button id="edge-del-btn" title="删除连线（双击线或按 Delete）"></button></div>
<div id="ghost"></div>
<div id="promptbox">
  <div style="font-weight:700;margin-bottom:6px">组件 md 规则（可复制给 AI）</div>
  <textarea id="prompt-text"></textarea>
  <div class="prow"><button class="btn" id="prompt-copy">复制</button><button class="btn" id="prompt-parse">从文本导入</button><button class="btn" id="prompt-close">关闭</button></div>
</div>

<script>
(function(){
  const S={docs:[],active:0,seq:1,zoom:1,panX:0,panY:0,onlyLogic:false,undirectedMode:false,selection:null,selectedEdge:null,defW:160,defH:90,extra:[],libSearch:'',showSidebar:true,libTab:'logic',snapOn:true,gridSnap:true,connectMode:false};
  const TYPES={logic:'逻辑',event:'事件',theory:'理论'};
  const COL={logic:'#4F46E5',event:'#059669',theory:'#EA580C'};
  function doc(){return S.docs[S.active];} function nodes(){return doc().nodes;} function edges(){return doc().edges;}
  function nodeW(n){return n.w;} function nodeH(n){return n.collapsed?32:n.h;}

  const world=document.getElementById('world'),viewport=document.getElementById('viewport'),edgesSvg=document.getElementById('edges'),gridSvg=document.getElementById('grid'),nodesEl=document.getElementById('nodes'),hint=document.getElementById('hint'),floatInput=document.getElementById('float-input'),floatText=document.getElementById('float-text'),ghost=document.getElementById('ghost'),tabsEl=document.getElementById('tabs'),sidebar=document.getElementById('sidebar'),libBody=document.getElementById('lib-body'),promptbox=document.getElementById('promptbox'),addLegend=document.getElementById('add-legend');

  /* ---------- 注入 SVG 图标 ---------- */
  const ICONS={
    plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
    save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
    saveas:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/><line x1="12" y1="2" x2="12" y2="6"/>',
    trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    undo:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
    redo:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/>',
    sidebar:'<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>',
    filter:'<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
    biline:'<line x1="3" y1="9" x2="21" y2="9"/><circle cx="6" cy="9" r="2.4"/><circle cx="18" cy="9" r="2.4"/>',
    upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
    download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
    arrow:'<line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/>',
    filedown:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="12" x2="12" y2="18"/><polyline points="9 15 12 18 15 15"/>',
    layout:'<rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="2" y="16" width="6" height="5" rx="1.5"/><rect x="16" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M5 16v-2h14v2"/>',
    magnet:'<path d="M7 3v8a5 5 0 0 0 10 0V3"/><line x1="7" y1="8" x2="11" y2="8"/><line x1="13" y1="8" x2="17" y2="8"/>',
    gridsnap:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>',

  function restoreWorkspace(data){ if(!data||!data.docs||!data.docs.length)return false;

    S.onlyLogic=!!data.onlyLogic; S.undirectedMode=!!data.undirectedMode; S.snapOn=data.snapOn!==false; S.gridSnap=data.gridSnap!==false; S.connectMode=!!data.connectMode;

  function parseMd(txt){ let cur=null,n=0; txt.split(/\r?\n/).forEach(line=>{ const h=line.match(/^##\s*(逻辑|事件|理论|logic|event|theory)\s*$/i); if(h){ cur=/逻辑/.test(h[1])?'logic':/事件/.test(h[1])?'event':/理论/.test(h[1])?'theory':h[1].toLowerCase(); if(!['logic','event','theory'].includes(cur))cur=null; return; } const m=line.match(/^[-*]\s*(.+)$/); if(m&&cur){ const v=m[1]; const i1=v.indexOf('：'),i2=v.indexOf(':'); const sep=i1>=0?i1:i2; if(sep>=0){S.extra.push({id:'x'+(++n)+Date.now(),type:cur,title:v.slice(0,sep).trim(),text:v.slice(sep+1).trim()});}else{S.extra.push({id:'x'+(++n)+Date.now(),type:cur,title:v.trim(),text:''});} } }); flashHint('已导入 '+n+' 个组件'); scheduleSave(); }

  function renderLib(){ libBody.innerHTML=''; document.querySelectorAll('.lib-tab').forEach(t=>t.classList.toggle('sel',t.dataset.tab===S.libTab)); const q=S.libSearch.trim().toLowerCase(); const list=allComponents().filter(c=>c.type===S.libTab && (!q||(c.title||'').toLowerCase().includes(q)||(c.text||'').toLowerCase().includes(q))).sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh')); if(!list.length){libBody.innerHTML='<div style="color:#999;font-size:13px;padding:10px;text-align:center">无匹配组件</div>';return;} list.forEach(c=>{ const card=document.createElement('div');card.className='lib-card';card.dataset.type=c.type;card.style.background=COL[c.type]; card.innerHTML='<div class="t">'+esc(c.title||'(无标题)')+'</div>'+(c.text?'<div class="c">'+esc(c.text)+'</div>':''); card.addEventListener('pointerdown',e=>{if(e.button===0)startLibGhost(e,c);}); card.addEventListener('click',()=>{if(!moved)addNodeFromComponent(c);}); libBody.appendChild(card); }); }

  /* 历史 */
  function snapshot(){ return JSON.stringify({nodes:doc().nodes,edges:doc().edges}); }
  function pushHistory(){ doc().undoStack.push(snapshot()); if(doc().undoStack.length>100)doc().undoStack.shift(); doc().redoStack=[]; markDirty(); }
  function undo(){ const d=doc(); if(!d.undoStack.length)return; d.redoStack.push(snapshot()); const s=JSON.parse(d.undoStack.pop()); d.nodes=s.nodes;d.edges=s.edges; markDirty(); renderAll();flashHint('撤销'); }
  function redo(){ const d=doc(); if(!d.redoStack.length)return; d.undoStack.push(snapshot()); const s=JSON.parse(d.redoStack.pop()); d.nodes=s.nodes;d.edges=s.edges; markDirty(); renderAll();flashHint('重做'); }

  window.addEventListener('keydown',e=>{ const ctrl=e.ctrlKey||e.metaKey; if(ctrl && e.key.toLowerCase()==='s'){e.preventDefault();saveFile();return;} if(e.target&&(e.target.contentEditable==='true'||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'))return;

    if(left&&right){ const target=((left.x+left.w)+(right.x)-n.w)/2; const d=target-n.x; if(Math.abs(d)<=th){ n.x+=d; res.h={left,right,gapL:Math.round(n.x-(left.x+left.w)),gapR:Math.round(right.x-(n.x+n.w))}; } }
    let up=null,down=null; others.forEach(o=>{ if(Math.min(n.x+n.w,o.x+o.w)-Math.max(n.x,o.x)<=2)return; const oH=nodeH(o); const oc=o.y+oH/2; if(oc<cy){ if(!up||(o.y+oH)>(up.y+nodeH(up)))up=o; } else { if(!down||o.y<down.y)down=o; } });
    if(up&&down){ const target=((up.y+nodeH(up))+(down.y)-H)/2; const d=target-n.y; if(Math.abs(d)<=th){ n.y+=d; res.v={up,down,gapU:Math.round(n.y-(up.y+nodeH(up))),gapD:Math.round(down.y-(n.y+H))}; } }
    return res; }
  function rawLine(a1,a2,b1,b2){ const el=document.createElementNS(NS,'line'); el.setAttribute('x1',a1);el.setAttribute('y1',a2);el.setAttribute('x2',b1);el.setAttribute('y2',b2); el.setAttribute('stroke','#f43f5e');el.setAttribute('stroke-width','1.1');el.setAttribute('stroke-dasharray','5 4');el.setAttribute('vector-effect','non-scaling-stroke'); guidesSvg.appendChild(el); }
  function dimLine(a1,a2,b1,b2){ const el=document.createElementNS(NS,'line'); el.setAttribute('x1',a1);el.setAttribute('y1',a2);el.setAttribute('x2',b1);el.setAttribute('y2',b2); el.setAttribute('stroke','#f43f5e');el.setAttribute('stroke-width','1.3');el.setAttribute('vector-effect','non-scaling-stroke'); guidesSvg.appendChild(el); }
  function dimX(x1,x2,y){ const t=4/S.zoom; dimLine(x1,y,x2,y); dimLine(x1,y-t,x1,y+t); dimLine(x2,y-t,x2,y+t); }
  function dimY(y1,y2,x){ const t=4/S.zoom; dimLine(x,y1,x,y2); dimLine(x-t,y1,x+t,y1); dimLine(x-t,y2,x+t,y2); }
  function guideText(x,y,txt){ const t=document.createElementNS(NS,'text'); t.setAttribute('x',x);t.setAttribute('y',y); t.setAttribute('fill','#e11d48'); t.setAttribute('font-size',(11/S.zoom)+''); t.setAttribute('text-anchor','middle'); t.setAttribute('style','paint-order:stroke;stroke:#fff;stroke-width:3px;'); t.textContent=txt; guidesSvg.appendChild(t); }
  function renderGuides(n,sn,eq){ guidesSvg.innerHTML=''; const pad=16/S.zoom; if(sn.gx!=null&&sn.xo){ rawLine(sn.gx,Math.min(n.y,sn.xo.y)-pad,sn.gx,Math.max(n.y+nodeH(n),sn.xo.y+nodeH(sn.xo))+pad); } if(sn.gy!=null&&sn.yo){ rawLine(Math.min(n.x,sn.yo.x)-pad,sn.gy,Math.max(n.x+n.w,sn.yo.x+sn.yo.w)+pad,sn.gy); }
    if(eq&&eq.h){ const {left,right,gapL,gapR}=eq.h; const y=Math.min(left.y,right.y,n.y)-18/S.zoom; dimX(left.x+left.w,n.x,y); dimX(n.x+n.w,right.x,y); guideText((left.x+left.w+n.x)/2,y-4/S.zoom,gapL+''); guideText((n.x+n.w+right.x)/2,y-4/S.zoom,gapR+''); }
    if(eq&&eq.v){ const {up,down,gapU,gapD}=eq.v; const x=Math.min(up.x,down.x,n.x)-18/S.zoom; dimY(up.y+nodeH(up),n.y,x); dimY(n.y+nodeH(n),down.y,x); guideText(x-4/S.zoom,((up.y+nodeH(up))+n.y)/2+4/S.zoom,gapU+''); guideText(x-4/S.zoom,(n.y+nodeH(n)+down.y)/2+4/S.zoom,gapD+''); } }
  function clearGuides(){ guidesSvg.innerHTML=''; }
  function rectsOverlap(a,b,pad){ return !(a.x+a.w+pad<=b.x||b.x+b.w+pad<=a.x||a.y+a.h+pad<=b.y||b.y+b.h+pad<=a.y); }
  function placeAvoidOverlap(n){ const pad=40,step=40; let i=0; while(i++<200){ const a={x:n.x,y:n.y,w:n.w,h:nodeH(n)}; const hit=visibleNodes().some(o=>o.id!==n.id&&rectsOverlap(a,{x:o.x,y:o.y,w:o.w,h:nodeH(o)},pad)); if(!hit)break; n.y+=step; if(i%12===0){ n.y-=step*12; n.x+=n.w+pad; } } return n; }
  /* ---------- 逻辑链等距：松手一次，把所在整条直线链 A-B-C-D-E… 全部均化（无父子，按无向邻接） ---------- */
  const CHAIN_TOL=80, CHAIN_MINGAP=16;
  function overlapY(a,b){ return Math.min(a.y+nodeH(a),b.y+nodeH(b))-Math.max(a.y,b.y); }
  function overlapX(a,b){ return Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x); }
  function evenOutChain(n){
    if(!n)return false;
    const vis=new Set(visibleNodes().map(o=>o.id));
    const adj={};
    edges().forEach(e=>{ if(!vis.has(e.from)||!vis.has(e.to)||e.from===e.to)return; (adj[e.from]=adj[e.from]||new Set()).add(e.to); (adj[e.to]=adj[e.to]||new Set()).add(e.from); });
    const nb=id=>[...(adj[id]||[])].map(byId).filter(Boolean);
    /* 从 n 出发，沿“共线”邻接贪心延伸，取经过 n 的最长直线链段 */
    function run(horiz){
      const seen=new Set([n.id]); const back=[]; let cur=n;
      const backOk=(o,c)=>horiz?(overlapY(c,o)>2 && o.x+o.w/2<c.x+c.w/2):(overlapX(c,o)>2 && o.y+nodeH(o)/2<c.y+nodeH(c)/2);
      const fwdOk=(o,c)=>horiz?(overlapY(c,o)>2 && o.x+o.w/2>c.x+c.w/2):(overlapX(c,o)>2 && o.y+nodeH(o)/2>c.y+nodeH(c)/2);
      const pick=(o,c,best)=>horiz?(!best||(o.x+o.w)>(best.x+best.w)):(!best||(o.y+nodeH(o))>(best.y+nodeH(best)));
      const pickF=(o,c,best)=>horiz?(!best||o.x<best.x):(!best||o.y<best.y);
      while(true){ let next=null; nb(cur.id).forEach(o=>{ if(seen.has(o.id)||!backOk(o,cur))return; if(!next||pick(o,cur,next))next=o; }); if(!next)break; seen.add(next.id); back.push(next); cur=next; }
      const fwd=[]; cur=n;
      while(true){ let next=null; nb(cur.id).forEach(o=>{ if(seen.has(o.id)||!fwdOk(o,cur))return; if(!next||pickF(o,cur,next))next=o; }); if(!next)break; seen.add(next.id); fwd.push(next); cur=next; }
      return back.reverse().concat([n],fwd);
    }
    function spread(arr,horiz){
      if(arr.length<3)return false;
      const pos=a=>horiz?a.x:a.y, size=a=>horiz?a.w:nodeH(a);
      const gaps=[]; for(let i=0;i<arr.length-1;i++){ const g=pos(arr[i+1])-(pos(arr[i])+size(arr[i])); gaps.push(g); if(g<-6)return false; }
      const gmax=Math.max.apply(null,gaps),gmin=Math.min.apply(null,gaps);
      if(gmax-gmin>CHAIN_TOL)return false;            /* 间距差异明显＝刻意为之，不动 */
      const start=pos(arr[0]), total=arr.reduce((s,a)=>s+size(a),0);
      const span=(pos(arr[arr.length-1])+size(arr[arr.length-1]))-start;
      let gap=(span-total)/(arr.length-1); if(!(gap>=CHAIN_MINGAP))gap=CHAIN_MINGAP;
      let cur=start; arr.forEach(a=>{ if(horiz)a.x=cur; else a.y=cur; cur+=size(a)+gap; });
      return true;
    }
    const rh=run(true), rv=run(false);
    if(rh.length>=rv.length)return spread(rh,true);
    return spread(rv,false);
  }

  /* ---------- 一键整理布局（思维导图式排版：同级同行对齐·同级等宽·父节点居中·等距） ---------- */
  const H_GAP=42, V_GAP=64;
  function tidyLayout(){
    const ns=visibleNodes(); if(ns.length<2){ flashHint('至少需要两个节点'); return; }
    pushHistory();
    const byid={}; ns.forEach(n=>{byid[n.id]=n;});
    const origMinX=Math.min.apply(null,ns.map(n=>n.x)), origMinY=Math.min.apply(null,ns.map(n=>n.y));
    const kids={},hasParent={}; ns.forEach(n=>{kids[n.id]=[];});
    edges().forEach(e=>{ const a=byid[e.from],b=byid[e.to]; if(a&&b&&e.from!==e.to){ if(kids[e.from].indexOf(e.to)<0)kids[e.from].push(e.to); hasParent[e.to]=true; } });
    const depth={},parent={},seen={};
    function bfs(seed){ let fr=seed.slice(),g=0; while(fr.length&&g++<5000){ const nx=[]; fr.forEach(id=>{ kids[id].forEach(cid=>{ if(seen[cid])return; seen[cid]=1; depth[cid]=(depth[id]||0)+1; parent[cid]=id; nx.push(cid); }); }); fr=nx; } }
    const roots=ns.filter(n=>!hasParent[n.id]);
    roots.forEach(r=>{ depth[r.id]=0; seen[r.id]=1; });
    bfs(roots.map(r=>r.id));
    ns.filter(n=>depth[n.id]==null).sort((a,b)=>(a.y-b.y)||(a.x-b.x)).forEach(n=>{ depth[n.id]=0; seen[n.id]=1; parent[n.id]=undefined; roots.push(n); bfs([n.id]); });
    const levels={}; ns.forEach(n=>{ const d=depth[n.id]; (levels[d]=levels[d]||[]).push(n); });
    Object.keys(levels).forEach(d=>{ const W=Math.max.apply(null,levels[d].map(n=>n.w)); levels[d].forEach(n=>{ n.w=W; }); });
    const maxD=Math.max.apply(null,ns.map(n=>depth[n.id]));
    const rowH=[]; for(let k=0;k<=maxD;k++){ const lv=levels[k]||[]; rowH[k]=lv.length?Math.max.apply(null,lv.map(nodeH)):60; }
    const rowY=[]; rowY[0]=origMinY; for(let k=1;k<=maxD;k++)rowY[k]=rowY[k-1]+rowH[k-1]+V_GAP;
    function kidsOf(id){ return kids[id].filter(c=>parent[c]===id); }
    function shiftSub(id,dx){ byid[id].x+=dx; kids[id].forEach(c=>{ if(parent[c]===id)shiftSub(c,dx); }); }
    let cursor=0;
    function place(id){
      const start=cursor;
      const cs=kidsOf(id).slice().sort((a,b)=>(byid[a].x||0)-(byid[b].x||0));
      const w=byid[id].w; let x,l,r;
      if(!cs.length){ x=start; l=x; r=x+w; }
      else { const sp=cs.map(place); const cL=sp[0].l,cR=sp[sp.length-1].r; x=(cL+cR)/2-w/2; l=Math.min(x,cL); r=Math.max(x+w,cR); if(l<start){ const dx=start-l; shiftSub(id,dx); x+=dx;l+=dx;r+=dx; } }
      byid[id].x=x; cursor=Math.max(cursor,r+H_GAP); return {l,r};
    }
    roots.forEach(place);
    ns.forEach(n=>{ n.y=rowY[depth[n.id]]; });
    const dx=origMinX-Math.min.apply(null,ns.map(n=>n.x)); if(dx)ns.forEach(n=>{ n.x+=dx; });
    renderAll(); markDirty(); flashHint('已整理布局：同级对齐 · 父节点居中 · 等距');
  }

  /* 缩放/网格 */
  function setZoom(z){const r=viewport.getBoundingClientRect();const cx=r.width/2,cy=r.height/2;const wx=(cx-S.panX)/S.zoom,wy=(cy-S.panY)/S.zoom;S.zoom=Math.min(4,Math.max(0.2,z));S.panX=cx-wx*S.zoom;S.panY=cy-wy*S.zoom;applyTransform();}
  function applyTransform(){world.style.transform='translate('+S.panX+'px,'+S.panY+'px) scale('+S.zoom+')';renderGrid();updateEdgeTools();scheduleSave();}
  viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;const wx=(mx-S.panX)/S.zoom,wy=(my-S.panY)/S.zoom;S.zoom=Math.min(4,Math.max(0.2,S.zoom*(e.deltaY<0?1.1:1/1.1)));S.panX=mx-wx*S.zoom;S.panY=my-wy*S.zoom;applyTransform();},{passive:false});
  function renderGrid(){const w=viewport.clientWidth,h=viewport.clientHeight;gridSvg.setAttribute('width',w);gridSvg.setAttribute('height',h);const z=S.zoom||1;let step=10;while(step*z<28)step*=2;const major=step*5;const x0=Math.floor((-S.panX)/z/step)*step,x1=Math.ceil((w-S.panX)/z/step)*step;const y0=Math.floor((-S.panY)/z/step)*step,y1=Math.ceil((h-S.panY)/z/step)*step;let mi='',ma='';for(let wx=x0;wx<=x1;wx+=step){const sx=Math.round(S.panX+wx*z)+0.5;if(wx%major===0)ma+='M'+sx+' 0 L'+sx+' '+h+' ';else mi+='M'+sx+' 0 L'+sx+' '+h+' ';}for(let wy=y0;wy<=y1;wy+=step){const sy=Math.round(S.panY+wy*z)+0.5;if(wy%major===0)ma+='M0 '+sy+' L'+w+' '+sy+' ';else mi+='M0 '+sy+' L'+w+' '+sy+' ';}gridSvg.innerHTML='<path d="'+mi+'" stroke="#eeeef2" stroke-width="1"/><path d="'+ma+'" stroke="#e0e1e8" stroke-width="1"/>'}

  /* 导出 */
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function flashHint(t){hint.textContent=t;}
  function logicOnly(){return{nodes:nodes().filter(n=>n.type==='logic'),edges:edges().filter(e=>byId(e.from)?.type==='logic'&&byId(e.to)?.type==='logic')};}
  function numId(id){ return parseInt(String(id).replace(/\D/g,''))||0; }
  function exportChain(fmt){const o=logicOnly();if(fmt==='md'){
    const ns=o.nodes.slice().sort((a,b)=>numId(a.id)-numId(b.id));
    const clean=s=>String(s==null?'':s).replace(/\r?\n/g,' ').replace(/\|/g,'｜').trim();
    let md='# 逻辑链\n\n## 1. 节点（标题 - 内容）\n';
    ns.forEach((n,i)=>{ md+=(i+1)+'. '+clean(n.title||'(无标题)')+(n.text?(' - '+clean(n.text)):'')+'\n'; });
    md+='\n## 2. 邻接矩阵\n';
    md+='单元格格式 `A_B`：A 表示该行与该列两个节点的有向关系，`1`=行指向列，`-1`=列指向行，`0`=无向连线；B 为连线文字；空白=两者没有连线。行列编号与上一节一致。\n\n';
    const N=ns.length;
    let head='|   |';for(let j=0;j<N;j++)head+=' '+(j+1)+' |';md+=head+'\n';
    let sep='|---|';for(let j=0;j<N;j++)sep+='---|';md+=sep+'\n';
    for(let i=0;i<N;i++){ let row='| '+ (i+1) +' |';
      for(let j=0;j<N;j++){ let v='';
        if(i===j){ v='·'; }
        else { const parts=o.edges.filter(e=>(e.from===ns[i].id&&e.to===ns[j].id)||(e.from===ns[j].id&&e.to===ns[i].id)).map(e=>{ let a; if(!e.directed)a=0; else if(e.from===ns[i].id)a=1; else a=-1; return a+'_'+(e.label||''); }); v=parts.length?clean(parts.join(' / ')):''; }
        row+=' '+v+' |';
      }
      md+=row+'\n';
    }
    downloadText(md,doc().name+'-逻辑链.md','text/markdown');
   }else{downloadText(JSON.stringify({nodes:o.nodes,edges:o.edges},null,2),doc().name+'-逻辑链.json','application/json');}flashHint('已导出逻辑链');}
  function downloadText(txt,name,type){const b=new Blob([txt],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
  function bounds(){let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;nodes().forEach(n=>{if(S.onlyLogic&&n.type!=='logic')return;minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxX=Math.max(maxX,n.x+n.w);maxY=Math.max(maxY,n.y+nodeH(n));});if(!nodes().length)return{x:0,y:0,w:400,h:300};return{x:minX,y:minY,w:maxX-minX,h:maxY-minY};}
  function exportJPG(){const b=bounds(),pad=60,scale=Math.min(2,2400/Math.max(b.w,b.h));const W=Math.round(b.w*scale+pad*2),H=Math.round(b.h*scale+pad*2);const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(pad-b.x*scale,pad-b.y*scale);ctx.scale(scale,scale);edges().forEach(e=>{const a=byId(e.from),c=byId(e.to);if(!a||!c)return;if(S.onlyLogic&&(a.type!=='logic'||c.type!=='logic'))return;const p1=portPos(a,e.fromPort),p2=portPos(c,e.toPort);const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2-40;ctx.strokeStyle='#5a6472';ctx.lineWidth=1.8/scale;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.quadraticCurveTo(mx,my,p2.x,p2.y);ctx.stroke();if(e.directed){const t=Math.atan2(p2.y-my,p2.x-mx),s=9;ctx.fillStyle='#fff';ctx.strokeStyle='#333';ctx.lineWidth=1.4/scale;ctx.beginPath();ctx.moveTo(p2.x,p2.y);ctx.lineTo(p2.x-s*Math.cos(t-0.45),p2.y-s*Math.sin(t-0.45));ctx.lineTo(p2.x-s*Math.cos(t+0.45),p2.y-s*Math.sin(t+0.45));ctx.closePath();ctx.fill();ctx.stroke();}if(e.label){ctx.font='13px "LXGW WenKai","KaiTi",serif';ctx.fillStyle='#333';ctx.textAlign='center';ctx.fillText(e.label,mx,my-6);}});nodes().forEach(n=>{if(S.onlyLogic&&n.type!=='logic')return;const col=n.type==='logic'?'#4F46E5':n.type==='event'?'#059669':'#EA580C';ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=3/scale;roundRect(ctx,n.x,n.y,n.w,nodeH(n),8);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 14px "LXGW WenKai","KaiTi",serif';ctx.textAlign='left';if(n.title)ctx.fillText(n.title,n.x+8,n.y+18);if(!n.collapsed&&n.text){ctx.font='14px "LXGW WenKai","KaiTi",serif';wrapText(ctx,n.text,n.x+8,n.y+36,n.w-16,18);}});ctx.restore();const a=document.createElement('a');a.href=cv.toDataURL('image/jpeg',0.9);a.download=doc().name+'.jpg';a.click();flashHint('已导出 JPG');}
  function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function wrapText(ctx,text,x,y,maxW,lh){const arr=Array.from(text);let line='';for(const ch of arr){if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,y);y+=lh;line=ch;}else line+=ch;}if(line)ctx.fillText(line,x,y);}

  /* 初始化 */
  showLoading(true);
  (async function(){
    let ok=false;
    try{ ok=await loadAutoSave(); }catch(e){ ok=false; }
    if(!ok){ newDoc('大纲1'); applyTransform(); addLegend.style.left='272px'; renderLib(); }
    showLoading(false);
    flashHint(ok?'已重新拉取工作区文件':'浮动画板拖出节点 · ⠿移动 · ▾折叠 · 单击编辑 · 双击删除 · 端口连线 · 点线选中');
  })();
  window.addEventListener('resize',renderGrid);
  window.addEventListener('beforeunload',e=>{ if(S.docs.some(d=>d.dirty)){ e.preventDefault(); e.returnValue=''; return ''; } });
  window.addEventListener('pointerdown',e=>{if(!e.target.closest('.node')&&!e.target.closest('.edge-hit')&&!e.target.closest('.edge-port')&&!e.target.closest('#sidebar')&&!e.target.closest('#toolbar')&&!e.target.closest('#add-legend')){if(S.selectedEdge){S.selectedEdge=null;renderEdges();}}});
})();
