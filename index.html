<div id="toolbar">
  <span class="brand"><svg width="36" height="36" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" fill="#fff" stroke="#d8d8e0" stroke-width="1"/><rect x="4" y="4" width="4.6" height="16" rx="2.2" fill="#2E4A7D"/><rect x="9.7" y="4" width="4.6" height="16" rx="2.2" fill="#2F6B5A"/><rect x="15.4" y="4" width="4.6" height="16" rx="2.2" fill="#9C4B2F"/></svg></span>
  <button class="btn" id="new-doc" data-group="file" title="新建">ICON(plus)</button>
  <button class="btn" id="open-doc" data-group="file" title="打开">ICON(folder)</button>
  <button class="btn" id="save-doc" data-group="file" title="保存">ICON(save)</button>
  <button class="btn" id="saveas-doc" data-group="file" title="另存为文件(File System Access)">ICON(saveas)</button>
  <button class="btn" id="export-json" data-group="file" title="导出数据(.json · 浏览器下载)">ICON(filedown)</button>
  <button class="btn" id="clear-doc" data-group="file" title="清空">ICON(trash)</button>
  <button class="btn" id="undo" data-group="edit" title="撤销">ICON(undo)</button>
  <button class="btn" id="redo" data-group="edit" title="恢复撤销">ICON(redo)</button>
  <span class="sep"></span>
  <button class="btn" id="lib" data-group="view" title="组件库">ICON(sidebar)</button>
  <button class="btn" id="only-logic" data-group="view" title="只看逻辑链">ICON(filter)</button>
  <button class="btn" id="undirected" data-group="view" title="无向/有向线开关">ICON(biline)</button>
  <button class="btn" id="connect-mode" data-group="view" title="连线模式：开启后依次点两个框即自动连线（有向/无向跟随左侧开关，自动选最美观的出线侧），Esc 取消">ICON(connect)</button>
  <button class="btn" id="export-chain-md" data-group="view" title="导逻辑链(单击md/双击json)">ICON(upload)</button>
  <button class="btn" id="tidy-layout" data-group="view" title="整理布局（同级同行对齐·同级等宽·父节点居中·等距）">ICON(layout)</button>
  <button class="btn on" id="snap-toggle" data-group="view" title="智能吸附（拖动时显示对齐提示；关闭则自由摆放）">ICON(magnet)</button>
  <button class="btn on" id="grid-snap" data-group="view" title="网格吸附（节点对齐到网格线）">ICON(gridsnap)</button>
  <span class="sep"></span>
  <button class="btn" id="import-md" data-group="io" title="导入组件md">ICON(download)</button>
  <button class="btn" id="copy-prompt" data-group="io" title="复制md规则">ICON(copy)</button>
  <button class="btn" id="export-jpg" data-group="io" title="导出JPG">ICON(image)</button>
  <span class="sep"></span>
  <button class="btn" id="zoom-out" data-group="zoom" title="缩小">−</button>
  <button class="btn" id="zoom-reset" data-group="zoom" title="复位">1:1</button>
  <button class="btn" id="zoom-in" data-group="zoom" title="放大">＋</button>
  <span class="sep"></span>
  <span class="dim" title="宽度（水平方向）"><svg width="20" height="10" viewBox="0 0 20 10" fill="none" stroke="#777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="5" x2="19" y2="5"/><polyline points="5 2 1 5 5 8"/><polyline points="15 2 19 5 15 8"/></svg></span><input class="num" id="def-w" value="160">
  <span class="dim" title="高度（垂直方向）"><svg width="8" height="20" viewBox="0 0 8 20" fill="none" stroke="#777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="1" x2="4" y2="19"/><polyline points="1 5 4 1 7 5"/><polyline points="1 15 4 19 7 15"/></svg></span><input class="num" id="def-h" value="90">
  <span class="sep"></span>
  <div id="tabs"></div>
  <input type="file" id="import-file" accept=".json,.md" style="display:none">
  <input type="file" id="import-md-file" accept=".md,.txt" style="display:none">
  <input type="file" id="image-file" accept="image/*" style="display:none">
</div>

<div id="sidebar">
  <div id="lib-head"><input id="lib-search" placeholder="搜索标题/内容…"></div>
  <div id="lib-tabs"></div>
  <div id="lib-body"></div>
</div>

<div id="viewport"><svg id="grid"></svg><div id="world"><svg id="edges"></svg><div id="nodes"></div><svg id="guides"></svg></div></div>

<div id="add-legend"></div>

<div id="type-pop">
  <div class="tp-title">卡片类型</div>
  <div class="tp-row"><input type="text" id="tp-name" placeholder="类型名称" maxlength="8"><input type="color" id="tp-color" value="#2E4A7D"></div>
  <div class="tp-row"><input type="text" id="tp-hex" placeholder="#RRGGBB 自定义" maxlength="7" spellcheck="false" autocomplete="off"><span class="tp-prev" id="tp-prev"></span></div>
  <div class="tp-swatches" id="tp-swatches"></div>
  <div class="tp-actions"><button class="danger" id="tp-del" title="删除该类型">ICON(trash)</button><span class="grow"></span><button id="tp-cancel">取消</button><button id="tp-ok">确定</button></div>
</div>

<div id="type-picker"></div>

<div id="trash-pop">
  <div class="tp-title">被删除库</div>
  <div id="tr-list"></div>
  <div class="tr-actions"><button id="tr-all" title="全选"></button><button id="tr-inv" title="反选"></button><span class="grow"></span><button class="danger" id="tr-del" title="清空选中的类别"></button></div>
</div>

<div id="comp-pop">
  <div class="cp-title">组件</div>
  <input type="text" id="cp-title" placeholder="标题" maxlength="80" spellcheck="false">
  <textarea id="cp-text" placeholder="内容"></textarea>
  <div class="cp-types" id="cp-types"></div>
  <div class="cp-actions"><button class="danger" id="cp-del" title="删除该组件">ICON(trash)</button><span class="grow"></span><button id="cp-cancel">取消</button><button id="cp-ok">确定</button></div>
</div>

<div id="hint"></div>
<div id="loading"><div class="spinner"></div><div class="load-txt">正在加载工作区…</div></div>
<div class="float-input" id="float-input"><textarea id="float-text"></textarea><div class="row"><button id="float-cancel">取消</button><button id="float-ok">确定</button></div></div>
<div id="edge-tools"><button id="edge-label-btn" title="编辑连线文字（单击线后自动进入，或直接点此笔头）"></button></div>
<div id="ghost"></div>
<div id="promptbox">
  <div style="font-weight:700;margin-bottom:6px">组件 md 规则（可复制给 AI）</div>
  <textarea id="prompt-text"></textarea>
  <div class="prow"><button class="btn" id="prompt-copy">复制</button><button class="btn" id="prompt-parse">从文本导入</button><button class="btn" id="prompt-close">关闭</button></div>
</div>

<script>
(function(){
  const S={docs:[],active:0,seq:1,zoom:1,panX:0,panY:0,onlyLogic:false,undirectedMode:false,selection:null,selectedEdge:null,defW:160,defH:90,extra:[],libSearch:'',showSidebar:true,libTab:'',deletedBuiltins:[],snapOn:true,gridSnap:true,connectMode:false,lastGc:''};
  const BUILTIN_TYPES=[{id:'logic',name:'逻辑',color:'#2E4A7D',builtin:true},{id:'event',name:'事件',color:'#2F6B5A',builtin:true},{id:'theory',name:'理论',color:'#9C4B2F',builtin:true}];
  const TYPE_COLORS=['#2E4A7D','#2F6B5A','#9C4B2F','#5B4B8A','#8A6D1F','#1F6F8B','#A03E56','#3A4A5A','#6B4C3A','#4B6B2F','#2B5F6B','#7A3B5E'];
  const LEGACY_COLORS={'#4f46e5':'#2E4A7D','#059669':'#2F6B5A','#ea580c':'#9C4B2F','#0ea5e9':'#1F6F8B','#7c3aed':'#5B4B8A','#db2777':'#A03E56','#ca8a04':'#8A6D1F','#475569':'#3A4A5A'};
  const DEFAULT_TYPE_COLOR='#3A4A5A';
  function pickHex(v){
    let s=String(v==null?'':v).trim().replace(/^#+/,'');
    if(/^[0-9a-f]{3}$/i.test(s))s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
    return /^[0-9a-f]{6}$/i.test(s)?'#'+s.toUpperCase():null;
  }
  function normColor(v){ const h=pickHex(v); return h?(LEGACY_COLORS[h.toLowerCase()]||h):null; }
  function normType(x,base,builtin,now){
    return {id:base.id,name:String((x&&x.name)||base.name).slice(0,8),color:normColor(x&&x.color)||base.color,builtin:!!builtin,
      born:(x&&+x.born)||now,used:!!(x&&x.used),trashed:!!(x&&x.trashed),delT:(x&&+x.delT)||0};
  }
  function normalizeTypes(arr){
    const src=Array.isArray(arr)?arr:[],out=[],seen={},now=Date.now();
    const dead={}; (S.deletedBuiltins||[]).forEach(id=>{dead[id]=1;});
    BUILTIN_TYPES.forEach(t=>{ const m=src.filter(x=>x&&x.id===t.id)[0]; const o=normType(m,t,true,now); if(dead[t.id]){o.trashed=true;o.delT=o.delT||now;} out.push(o); seen[t.id]=1; });
    src.forEach(x=>{ if(!x||!x.id||seen[x.id])return; seen[x.id]=1; const id=String(x.id); out.push(normType(x,{id,name:String(x.name||id).slice(0,8),color:DEFAULT_TYPE_COLOR},false,now)); });
    if(!out.length)out.push(normType(null,{id:'type0',name:'类型',color:DEFAULT_TYPE_COLOR},false,now));
    if(!out.some(t=>!t.trashed))out[0].trashed=false;
    S.deletedBuiltins=[];
    return out;
  }
  S.types=normalizeTypes(null);
  function typeDef(id){ for(let i=0;i<S.types.length;i++)if(S.types[i].id===id)return S.types[i]; return null; }
  function typeName(id){ const t=typeDef(id); return t?t.name:(id||'组件'); }
  function typeColor(id){ const t=typeDef(id); return t?t.color:DEFAULT_TYPE_COLOR; }
  function liveTypes(){ return S.types.filter(t=>!t.trashed); }
  function firstTypeId(){ const t=liveTypes()[0]; return t?t.id:(S.types[0]?S.types[0].id:'event'); }
  function fallbackType(){ const e=typeDef('event'); if(e&&!e.trashed)return 'event'; return firstTypeId(); }
  function currentType(){ const t=typeDef(S.libTab); return (t&&!t.trashed)?S.libTab:fallbackType(); }
  function typeInstanceCount(id){ let c=0; S.docs.forEach(d=>{ d.nodes.forEach(n=>{ if(n.type===id)c++; }); }); S.extra.forEach(x=>{ if(x.type===id)c++; }); return c; }
  function typeHasEdge(id){ let hit=false; S.docs.forEach(d=>{ const ids={}; d.nodes.forEach(n=>{ if(n.type===id)ids[n.id]=1; }); d.edges.forEach(e=>{ if(ids[e.from]||ids[e.to])hit=true; }); }); return hit; }
  function refreshTypeUsage(){
    const live={};
    S.docs.forEach(d=>d.nodes.forEach(n=>{live[n.type]=1;}));
    S.extra.forEach(x=>{live[x.type]=1;});
    S.types.forEach(t=>{ if(live[t.id])t.used=true; });
  }
  function doc(){return S.docs[S.active];} function nodes(){return doc().nodes;} function edges(){return doc().edges;}
  function nodeW(n){return n.w;} function nodeH(n){return n.collapsed?32:n.h;}

  const world=document.getElementById('world'),viewport=document.getElementById('viewport'),edgesSvg=document.getElementById('edges'),gridSvg=document.getElementById('grid'),nodesEl=document.getElementById('nodes'),hint=document.getElementById('hint'),floatInput=document.getElementById('float-input'),floatText=document.getElementById('float-text'),ghost=document.getElementById('ghost'),tabsEl=document.getElementById('tabs'),sidebar=document.getElementById('sidebar'),libBody=document.getElementById('lib-body'),promptbox=document.getElementById('promptbox'),addLegend=document.getElementById('add-legend'),libTabsEl=document.getElementById('lib-tabs'),typePop=document.getElementById('type-pop');

  /* ---------- 注入 SVG 图标 ---------- */
  const ICONS={
    plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
    save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
    saveas:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/><line x1="12" y1="2" x2="12" y2="6"/>',
    trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    undo:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
    redo:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/>',
    sidebar:'<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>',
    filter:'<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
    biline:'<line x1="3" y1="9" x2="21" y2="9"/><circle cx="6" cy="9" r="2.4"/><circle cx="18" cy="9" r="2.4"/>',
    upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
    download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
    arrow:'<line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/>',
    filedown:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="12" x2="12" y2="18"/><polyline points="9 15 12 18 15 15"/>',
    layout:'<rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="2" y="16" width="6" height="5" rx="1.5"/><rect x="16" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M5 16v-2h14v2"/>',
    magnet:'<path d="M7 3v8a5 5 0 0 0 10 0V3"/><line x1="7" y1="8" x2="11" y2="8"/><line x1="13" y1="8" x2="17" y2="8"/>',
    gridsnap:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>',
    connect:'<circle cx="5.5" cy="12" r="3"/><circle cx="18.5" cy="12" r="3"/><path d="M8.5 12h7"/><path d="M13.5 8.5L17 12l-3.5 3.5"/>',
    pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    tag:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
    selectall:'<path d="M9 11.5l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    invert:'<path d="M17 3l4 4-4 4"/><path d="M21 7H9a5 5 0 0 0-5 5v1"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h12a5 5 0 0 0 5-5v-1"/>'
  };
  function iconSvg(name){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>'; }
  document.querySelectorAll('#toolbar .btn').forEach(b=>{
    const id=b.id; if(id==='zoom-out'||id==='zoom-reset'||id==='zoom-in')return;
    const m=b.textContent.trim().match(/ICON\((\w+)\)/);
    if(m && ICONS[m[1]]){ b.innerHTML=iconSvg(m[1]); }
  });
  document.getElementById('undirected').innerHTML = iconSvg('arrow'); // 默认有向箭头
  document.getElementById('tp-del').innerHTML = iconSvg('trash');

  let connecting=null,tempLine=null,drag=null,edgeDrag=null,moved=false,ghostType=null,ghostPayload=null,lastMouseX=null,lastMouseY=null,linkFirst=null;

  /* ---------- 文档 / 文件 ---------- */
  function newDoc(name){ S.docs.push({id:Date.now()+'',name:name||('大纲'+(S.docs.length+1)),handle:null,dirty:false,nodes:[],edges:[],undoStack:[],redoStack:[]}); S.active=S.docs.length-1; S.selection=null; renderTabs();renderAll();renderLib(); scheduleSave(); return doc(); }
  function closeDoc(i){ S.docs.splice(i,1); if(!S.docs.length)newDoc(); if(S.active>=S.docs.length)S.active=S.docs.length-1; renderTabs();renderAll();renderLib(); scheduleSave(); }
  function inlineRename(span,d){ span.contentEditable='true'; span.focus(); const s=window.getSelection(),r=document.createRange(); r.selectNodeContents(span); s.removeAllRanges(); s.addRange(r); let done=false; const finish=()=>{ if(done)return; done=true; span.contentEditable='false'; const v=span.innerText.replace(/\u00a0/g,' ').trim(); if(v&&v!==d.name){d.name=v;d.dirty=true;} renderTabs();scheduleSave(); }; span.addEventListener('blur',finish); span.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();finish();} if(ev.key==='Escape'){span.innerText=d.name;finish();} }); }
  function markDirty(){ const d=doc(); if(d&&!d.dirty){ d.dirty=true; renderTabs(); } scheduleSave(); }
  function markSaved(d){ if(d){ d.dirty=false; renderTabs(); } }
  function renderTabs(){ tabsEl.innerHTML=''; S.docs.forEach((d,i)=>{ const t=document.createElement('div'); t.className='tab'+(i===S.active?' active':''); t.innerHTML='<span class="tname">'+esc(d.name)+'</span>'+(d.dirty?'<span class="tdot" title="未保存">●</span>':'')+'<span class="tclose" data-i="'+i+'">×</span>'; t.addEventListener('click',e=>{ if(e.target.classList.contains('tclose')){ if(d.dirty&&!confirm('「'+d.name+'」有未保存的修改，仍要关闭？'))return; closeDoc(+e.target.dataset.i);} else if(e.target.classList.contains('tname')&&e.target.contentEditable!=='true'){ S.active=i;S.selection=null;renderTabs();renderAll();renderLib();scheduleSave(); } }); t.querySelector('.tname').addEventListener('click',e=>{e.stopPropagation();inlineRename(e.target,d);}); tabsEl.appendChild(t); }); }
  function serialize(d){ return JSON.stringify({version:2,name:d.name,nodes:d.nodes,edges:d.edges},null,2); }
  function loadJson(txt,handle,name){ const d=JSON.parse(txt); const nd={id:Date.now()+'',name:name||d.name||('大纲'+(S.docs.length+1)),handle:handle||null,dirty:false,nodes:(d.nodes||[]).map(normalizeNode),edges:d.edges||[],undoStack:[],redoStack:[]}; S.docs.push(nd);S.active=S.docs.length-1;S.selection=null; const ids=nd.nodes.map(n=>parseInt(String(n.id).replace(/\D/g,'')||'0')).concat(nd.edges.map(e=>parseInt(String(e.id).replace(/\D/g,'')||'0'))); S.seq=Math.max(S.seq,...ids,0)+1; renderTabs();renderAll();renderLib(); scheduleSave(); }
  function normalizeNode(n){ return {title:n.title||'',text:n.text||'',img:n.img||'',collapsed:!!n.collapsed,w:n.w||S.defW,h:n.h||S.defH,type:(n.type&&n.type!=='image'&&typeDef(n.type))?n.type:fallbackType(),id:n.id,x:n.x||0,y:n.y||0}; }

  /* ---------- 自动保存：Origin Private File System（无需选文件，改动即存，刷新不丢） ---------- */
  const OPFS_FILE='huabu-workspace.json';
  let saveTimer=null, saving=false, pendingSave=false;
  function opfsSupported(){ return !!(navigator.storage&&navigator.storage.getDirectory); }
  async function opfsWrite(txt){ try{ const d=await navigator.storage.getDirectory(); const fh=await d.getFileHandle(OPFS_FILE,{create:true}); const w=await fh.createWritable(); await w.write(txt); await w.close(); return true; }catch(e){ return false; } }
  async function opfsRead(){ try{ const d=await navigator.storage.getDirectory(); const fh=await d.getFileHandle(OPFS_FILE,{create:false}); const f=await fh.getFile(); return await f.text(); }catch(e){ return null; } }

  function serializeWorkspace(){ return JSON.stringify({version:3,
    types:S.types,
    docs:S.docs.map(d=>({id:d.id,name:d.name,nodes:d.nodes,edges:d.edges})),
    extra:S.extra, active:S.active, seq:S.seq, zoom:S.zoom, panX:S.panX, panY:S.panY,
    onlyLogic:S.onlyLogic, undirectedMode:S.undirectedMode, defW:S.defW, defH:S.defH,
    showSidebar:S.showSidebar, libTab:S.libTab, libSearch:S.libSearch, snapOn:S.snapOn, gridSnap:S.gridSnap, connectMode:S.connectMode, deletedBuiltins:S.deletedBuiltins||[], lastGc:S.lastGc||'' },null,2); }

  function restoreWorkspace(data){ if(!data||!data.docs||!data.docs.length)return false;
    S.deletedBuiltins=Array.isArray(data.deletedBuiltins)?data.deletedBuiltins.filter(x=>typeof x==='string'):[];
    S.types=normalizeTypes(data.types);
    S.docs=data.docs.map(x=>({id:x.id||Date.now()+'',name:x.name||'大纲',handle:null,dirty:false,nodes:(x.nodes||[]).map(normalizeNode),edges:x.edges||[],undoStack:[],redoStack:[]}));
    S.extra=(data.extra||[]).slice();
    S.active=Math.min(Math.max(0,data.active|0),S.docs.length-1);
    S.seq=data.seq||1; S.zoom=data.zoom||1; S.panX=data.panX||0; S.panY=data.panY||0;

  function purgeTypes(ids,force){
    const set={}; (ids||[]).forEach(i=>{ set[i]=1; });

      S.docs.forEach(d=>{

        d.nodes.forEach(n=>{ if(!set[n.type]){ keep.push(n); alive[n.id]=1; } });

  /* ---------- 每月清理：六个月及以前的孤立类别、过期回收站类别 ---------- */
  const HALF_YEAR=1000*60*60*24*183;
  function monthKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function runMonthlyGc(){
    const key=monthKey(); if(S.lastGc===key)return false;
    S.lastGc=key;
    const now=Date.now();
    const ids=S.types.filter(t=>{
      if(t.trashed)return t.delT>0&&now-t.delT>=HALF_YEAR;
      if(!t.born||now-t.born<HALF_YEAR)return false;
      return typeInstanceCount(t.id)===0||!typeHasEdge(t.id);
    }).map(t=>t.id);
    if(!ids.length){ scheduleSave(); return false; }
    return purgeTypes(ids,true);
  }

  function renderLib(){ libBody.innerHTML=''; document.querySelectorAll('.lib-tab').forEach(t=>t.classList.toggle('sel',t.dataset.tab===S.libTab)); const q=S.libSearch.trim().toLowerCase(); const list=allComponents().filter(c=>c.type===S.libTab && (!q||(c.title||'').toLowerCase().includes(q)||(c.text||'').toLowerCase().includes(q))).sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh')); if(!list.length){libBody.innerHTML='<div style="color:#999;font-size:13px;padding:10px;text-align:center">无匹配组件</div>';return;} list.forEach(c=>{ const card=document.createElement('div');card.className='lib-card';card.dataset.type=c.type;card.style.background=typeColor(c.type); const label=c.title||'(无标题)'; card.innerHTML=(c.img?'<img class="thumb" alt="" src="'+c.img+'">':'')+'<div class="t">'+esc(label)+'</div>'+(c.text?'<div class="c">'+esc(c.text)+'</div>':''); const del=document.createElement('span');del.className='lib-del';del.title='删除该组件';del.innerHTML=iconSvg('trash');del.addEventListener('pointerdown',e=>{e.stopPropagation();});del.addEventListener('click',e=>{e.stopPropagation();deleteComp(c);});card.appendChild(del); card.addEventListener('pointerdown',e=>{if(e.button===0)startLibGhost(e,c);}); card.addEventListener('click',()=>{if(!moved)addNodeFromComponent(c);}); card.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();openCompEditor(c,card);}); libBody.appendChild(card); }); }

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function flashHint(t){hint.textContent=t;}
  function logicOnly(){const id=typeDef('logic')?'logic':firstTypeId();return{nodes:nodes().filter(n=>n.type===id),edges:edges().filter(e=>byId(e.from)?.type===id&&byId(e.to)?.type===id)};}
  function numId(id){ return parseInt(String(id).replace(/\D/g,''))||0; }
  function exportChain(fmt){const o=logicOnly();if(fmt==='md'){
    const ns=o.nodes.slice().sort((a,b)=>numId(a.id)-numId(b.id));
    const clean=s=>String(s==null?'':s).replace(/\r?\n/g,' ').replace(/\|/g,'｜').trim();
    let md='# 逻辑链\n\n## 1. 节点（标题 - 内容）\n';
    ns.forEach((n,i)=>{ md+=(i+1)+'. '+clean(n.title||'(无标题)')+(n.text?(' - '+clean(n.text)):'')+'\n'; });
    md+='\n## 2. 邻接矩阵\n';
    md+='单元格格式 `A_B`：A 表示该行与该列两个节点的有向关系，`1`=行指向列，`-1`=列指向行，`0`=无向连线；B 为连线文字；空白=两者没有连线。行列编号与上一节一致。\n\n';
    const N=ns.length;
    let head='|   |';for(let j=0;j<N;j++)head+=' '+(j+1)+' |';md+=head+'\n';
    let sep='|---|';for(let j=0;j<N;j++)sep+='---|';md+=sep+'\n';
    for(let i=0;i<N;i++){ let row='| '+ (i+1) +' |';
      for(let j=0;j<N;j++){ let v='';
        if(i===j){ v='·'; }
        else { const parts=o.edges.filter(e=>(e.from===ns[i].id&&e.to===ns[j].id)||(e.from===ns[j].id&&e.to===ns[i].id)).map(e=>{ let a; if(!e.directed)a=0; else if(e.from===ns[i].id)a=1; else a=-1; return a+'_'+(e.label||''); }); v=parts.length?clean(parts.join(' / ')):''; }
        row+=' '+v+' |';
      }
      md+=row+'\n';
    }
    downloadText(md,doc().name+'-逻辑链.md','text/markdown');
   }else{downloadText(JSON.stringify({nodes:o.nodes,edges:o.edges},null,2),doc().name+'-逻辑链.json','application/json');}flashHint('已导出逻辑链');}
  function downloadText(txt,name,type){const b=new Blob([txt],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
  function bounds(){let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;nodes().forEach(n=>{if(S.onlyLogic&&n.type!=='logic')return;minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxX=Math.max(maxX,n.x+n.w);maxY=Math.max(maxY,n.y+nodeH(n));});if(!nodes().length)return{x:0,y:0,w:400,h:300};return{x:minX,y:minY,w:maxX-minX,h:maxY-minY};}
  async function exportJPG(){if(document.fonts&&document.fonts.ready){try{await document.fonts.ready;}catch(e){}}const b=bounds(),pad=60,scale=Math.min(2,2400/Math.max(b.w,b.h));const W=Math.round(b.w*scale+pad*2),H=Math.round(b.h*scale+pad*2);const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const imgs={};await Promise.all(nodes().filter(n=>n.img).map(n=>new Promise(res=>{const im=new Image();im.onload=()=>{imgs[n.id]=im;res();};im.onerror=()=>res();im.src=n.img;})));ctx.save();ctx.translate(pad-b.x*scale,pad-b.y*scale);ctx.scale(scale,scale);edges().forEach(e=>{const a=byId(e.from),c=byId(e.to);if(!a||!c)return;if(S.onlyLogic&&(a.type!=='logic'||c.type!=='logic'))return;const p1=portPos(a,e.fromPort),p2=portPos(c,e.toPort);const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2-40;ctx.strokeStyle='#5a6472';ctx.lineWidth=1.8/scale;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.quadraticCurveTo(mx,my,p2.x,p2.y);ctx.stroke();if(e.directed){const t=Math.atan2(p2.y-my,p2.x-mx),s=9;ctx.fillStyle='#fff';ctx.strokeStyle='#333';ctx.lineWidth=1.4/scale;ctx.beginPath();ctx.moveTo(p2.x,p2.y);ctx.lineTo(p2.x-s*Math.cos(t-0.45),p2.y-s*Math.sin(t-0.45));ctx.lineTo(p2.x-s*Math.cos(t+0.45),p2.y-s*Math.sin(t+0.45));ctx.closePath();ctx.fill();ctx.stroke();}if(e.label){ctx.font='13px "LXGW WenKai","KaiTi",sans-serif';ctx.fillStyle='#333';ctx.textAlign='center';ctx.fillText(e.label,mx,my-6);}});nodes().forEach(n=>{if(S.onlyLogic&&n.type!=='logic')return;const col=typeColor(n.type);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=3/scale;roundRect(ctx,n.x,n.y,n.w,nodeH(n),8);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 14px "LXGW WenKai","KaiTi",sans-serif';ctx.textAlign='left';if(n.title)ctx.fillText(n.title,n.x+8,n.y+18);if(!n.collapsed){const im=imgs[n.id];if(im){const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;const bx=n.x+6,by=n.y+26,bw=n.w-12,bh=Math.max(16,nodeH(n)-32);const sc=Math.min(bw/iw,bh/ih);const dw=iw*sc,dh=ih*sc;ctx.drawImage(im,bx+(bw-dw)/2,by+(bh-dh)/2,dw,dh);}else if(n.text){ctx.font='14px "LXGW WenKai","KaiTi",sans-serif';wrapText(ctx,n.text,n.x+8,n.y+36,n.w-16,18);}}});ctx.restore();const a=document.createElement('a');a.href=cv.toDataURL('image/jpeg',0.9);a.download=doc().name+'.jpg';a.click();flashHint('已导出 JPG');}
  function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function wrapText(ctx,text,x,y,maxW,lh){const arr=Array.from(text);let line='';for(const ch of arr){if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,y);y+=lh;line=ch;}else line+=ch;}if(line)ctx.fillText(line,x,y);}

  /* 初始化 */
  showLoading(true);
  (async function(){
    let ok=false;
    try{ ok=await loadAutoSave(); }catch(e){ ok=false; }
    if(!ok){ newDoc('大纲1'); applyTransform(); addLegend.style.left='272px'; renderTypeUI(); }
    else { try{ runMonthlyGc(); }catch(e){} }
    showLoading(false);
    flashHint(ok?'已重新拉取工作区文件':'浮动画板拖出节点 · ⠿移动 · ▾折叠 · 单击编辑 · 双击删除 · 端口连线 · 点线选中');
  })();
  window.addEventListener('resize',renderGrid);
  window.addEventListener('beforeunload',e=>{ if(S.docs.some(d=>d.dirty)){ e.preventDefault(); e.returnValue=''; return ''; } });
  window.addEventListener('pointerdown',e=>{ if(typePop.style.display!=='none'&&!e.target.closest('#type-pop')&&!e.target.closest('#add-type'))closeTypePop(); if(!e.target.closest('#trash-pop')&&!e.target.closest('#trash-lib'))closeTrash(); if(!e.target.closest('#comp-pop'))closeCompPop(); if(!e.target.closest('#type-picker')&&!e.target.closest('.tagbtn'))closeTypePicker(); if(!e.target.closest('.node')&&!e.target.closest('.edge-hit')&&!e.target.closest('.edge-port')&&!e.target.closest('#sidebar')&&!e.target.closest('#toolbar')&&!e.target.closest('#add-legend')){if(S.selectedEdge){cancelEdgeClick();S.selectedEdge=null;renderEdges();}}});
})();
</script>
